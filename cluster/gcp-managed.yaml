# OPTIONAL provisioning template. Reading this file creates nothing.
# `chia up cluster/gcp-managed.yaml` CREATES a billable GCP VM.
# `chia down cluster/gcp-managed.yaml` DELETES that VM and its boot disk.
cluster_name: PivotGCP
tailnet:
  manage_all: true
  auth_key: ${TS_AUTHKEY}
  socks_proxy: 127.0.0.1:1155
provider:
  head_ip: ${HEAD_IP}
auth:
  ssh_user: ${HEAD_SSH_USER}
  ssh_private_key: ${HEAD_SSH_PRIVATE_KEY}
gcp_nodes:
  project: ${GCP_PROJECT}
  zone: ${GCP_ZONE}
  pivot_vm:
    machine_type: e2-standard-4
    count: 1
    image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts
    disk_size_gb: 50
    spot: false
    ssh_user: chia
    ssh_private_key: ${GCP_PRIVATE_KEY_PATH}
    setup_commands:
      - "sudo apt-get update && sudo apt-get install -y iverilog verilator yosys netcat-openbsd"
available_node_types:
  pivot_worker:
    resources: {pivot_tier0: 1, pivot_tier1: 4, pivot_synth: 1}
    num_workers: 1
    compatible_ips: ["@pivot_vm:0"]
    worker_env_commands:
      - "source $HOME/miniconda3/etc/profile.d/conda.sh && conda activate chia_env"
head_env_commands:
  - "source $HOME/miniconda3/etc/profile.d/conda.sh && conda activate chia_env"
head_start_ray_commands:
  - "ray start --head --port=6379 --include-dashboard=False --dashboard-agent-listen-port=0 --resources='{\"head\":1}'"
worker_start_ray_commands:
  - "ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0"
